<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter
                id="glow"
                x="-50%"
                y="-50%"
                width="300%"
                height="300%"
                filterUnits="userSpaceOnUse"
        >
            <feGaussianBlur stdDeviation="15" result="coloredBlur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.8" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Body strokes (greenish) -->
    <path
            fill="none"
            stroke="var(--color-accent-primary)"
            stroke-width="30"
            stroke-miterlimit="10"
            filter="url(#glow)"
            d="M519.81,698.97l-95.04-44.09c-59.33,10.37-118.65,20.75-177.38,34.74c-38.91,77.43-77.83,154.87-107.43,228.65C27.63,771.14,4.68,560.89,82.64,393s241.85-286.03,427.12-287.26 M507.18,699.29l92.05-44.42c59.33,10.37,118.65,20.75,177.38,34.74c38.91,77.43,77.83,154.87,107.43,228.65C996.37,771.14,1019.32,560.89,941.36,393S695.02,106.96,509.75,105.73"
    />

    <!-- Orange circle -->
    <circle
            cx="512"
            cy="400.08"
            r="132.05"
            fill="var(--color-accent-secondary)"
            stroke="var(--color-accent-secondary)"
            stroke-width="6"
            filter="url(#glow)"
    />
</svg>
